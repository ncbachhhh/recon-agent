[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-agent"
version = "0.1.0"
description = "Foundation for AI-assisted authorized reconnaissance and evidence collection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "coverage>=7.10,<8",
    "mypy>=1.18,<3",
    "pytest>=8.4,<10",
    "ruff>=0.13,<1",
]

[project.scripts]
recon-agent = "recon_agent.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["recon_agent", "recon_agent.*"]
namespaces = false

[tool.ruff]
target-version = "py312"
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src/recon_agent"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests/unit"]
addopts = ["--strict-config", "--strict-markers", "-m", "not external and not network"]
markers = [
    "integration: offline integration using fixtures and fakes, selected by explicit path",
    "external: requires external binaries or a lab environment; explicit opt-in only",
    "network: requires network connectivity, live targets, or provider APIs; explicit opt-in only",
]

[tool.coverage.run]
source = ["recon_agent"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
